          <div class="reviews__slider-container">
            <div class="reviews__slider-navigation">
              <div class="reviews__arrow reviews__arrow-prev">
                <svg width="26" height="16">
                  <use xlink:href="images/sprite.svg#arrow-big-left"></use>
                </svg>
              </div>
              <div class="reviews__pagination"></div>
              <div class="reviews__arrow reviews__arrow-next">
                <svg width="25" height="16">
                  <use xlink:href="images/sprite.svg#arrow-big-right"></use>
                </svg>
              </div>
            </div>
            <div class="reviews__slider-rating">
              <div class="reviews-box">
                <p class="reviews-box__number">4.9</p>
                <ul class="reviews-box__list">
                  <li class="reviews-box__item">
                    <svg width="22" height="20">
                      <use xlink:href="images/sprite.svg#star-active"></use>
                    </svg>
                  </li>
                  <li class="reviews-box__item">
                    <svg width="22" height="20">

                    </svg>
                  </li>
                </ul>
                <a class="reviews-box__all" href="#">458 ratings</a>
              </div>
            </div>
