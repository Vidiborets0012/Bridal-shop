<main class="main">
  <section class="checkout">
    <div class="container-big">
      <div class="checkout__top">
        <h2 class="checkout__title">Checkout</h2>
        <svg width="94" height="19">
          <use xlink:href="images/sprite.svg#checkout-decor"></use>
        </svg>
      </div>
      <div class="checkout__content">
        <div class="checkout__info">
          <form class="checkout__info-form">
            <div class="checkout__info-item">
              <p class="checkout__info-title">Personal information</p>
              <div class="checkout__infobox">
                <label class="checkout__infobox-label">
                  Your name
                  <input
                    class="checkout__infobox-input"
                    type="text"
                    placeholder="Enter your name"
                  />
                </label>
                <label class="checkout__infobox-label">
                  Your Last Name*
                  <input
                    class="checkout__infobox-input"
                    type="text"
                    placeholder="Enter your last name"
                    required
                  />
                </label>
                <label class="checkout__infobox-label">
                  Phone*
                  <input
                    class="checkout__infobox-input"
                    type="text"
                    placeholder="Enter your phone"
                    required
                  />
                </label>
                <label class="checkout__infobox-label">
                  Email*
                  <input
                    class="checkout__infobox-input"
                    type="text"
                    placeholder="Enter your email"
                    required
                  />
                </label>
              </div>
            </div>

            <div class="checkout__info-item">
              <p class="checkout__info-title">Delivery address</p>
              <div class="checkout__infobox">
                <label
                  class="checkout__infobox-label checkout__infobox-wrapp checkout__infobox--marker"
                >
                  City*
                  <select class="checkout__infobox-select">
                    <option selected>Select city</option>
                  </select>
                </label>
                <label
                  class="checkout__infobox-label checkout__infobox-wrapp checkout__infobox--arrow"
                >
                  Country*
                  <select class="checkout__infobox-select">
                    <option selected>Select country</option>
                  </select>
                </label>
                <label class="checkout__infobox-label">
                  Postal code*
                  <input
                    class="checkout__infobox-input"
                    type="text"
                    placeholder="Enter your postal code"
                    required
                  />
                </label>
                <label class="checkout__infobox-label">
                  Street name, house*
                  <input
                    class="checkout__infobox-input"
                    type="text"
                    placeholder="Enter address"
                    required
                  />
                </label>
              </div>
            </div>

            <div class="checkout__info-item">
              <p class="checkout__info-title">Delivery method</p>
              <p class="checkout__info-deltext">Select delivery method*</p>
              <div class="checkout__info-delbox">
                <div class="checkout__info-radio">
                  <label class="radio-label">
                    <input class="radio-box" type="radio" delivery checked />
                    <span class="radio-stile"></span>
                    <span class="radio-name">Nova Poshta </span>
                    <span class="radio-text">Delivery will take 2-7 days</span>
                  </label>
                  <p class="checkout__info-delprice">Free</p>
                </div>
                <div class="checkout__info-radio">
                  <label class="radio-label">
                    <input class="radio-box" type="radio" delivery />
                    <span class="radio-stile"></span>
                    <span class="radio-name">Nova Poshta (home delivery)</span>
                    <span class="radio-text">Delivery will take 2-7 days</span>
                  </label>
                  <p class="checkout__info-delprice">€20</p>
                </div>
              </div>
            </div>

            <div class="checkout__info-item">
              <p class="checkout__info-title">Payment</p>
              <div class="checkout__infobox-pay">
                <label class="checkout__infobox-label">
                  Your card number*
                  <input
                    class="checkout__infobox-input"
                    type="text"
                    placeholder="0000 0000 0000 0000"
                    required
                  />
                </label>

                <div class="checkout__infobox-paycard">
                  <label class="checkout__infobox-label">
                    Validity period*
                    <input
                      class="checkout__infobox-input"
                      type="text"
                      placeholder="ММ/YY"
                      required
                    />
                  </label>
                  <label class="checkout__infobox-label">
                    Code*
                    <input class="checkout__infobox-input" type="text" placeholder="000" required />
                  </label>
                </div>

                <label class="checkout__infobox-label">
                  Holder name*
                  <input
                    class="checkout__infobox-input"
                    type="text"
                    placeholder="Jane Brown"
                    required
                  />
                </label>
              </div>
            </div>

            <p class="checkout__info-text">
              By clicking the "Place an order" button, you agree to the privacy policy and user
              agreement
            </p>

            <button class="checkout__info-btn" type="submit">Place an order</button>
          </form>
        </div>
        <div class="checkout__details"></div>
      </div>
    </div>
  </section>
</main>
