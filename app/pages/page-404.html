<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxurious Bridal Haven</title>
    <link rel="stylesheet" href="css/style.min.css" />
  </head>
  <body>
    <div class="wrapper">
      <!--=include promo.partial.html  -->
      <!--=include header.partial.html  -->

      <main class="main">
        <section class="page-404">
          <div class="container container--big">
            <h1 class="visually-hidden">Luxurious Bridal Haven</h1>
            <div class="page-404__inner">
              <div class="page-404__content-box">
                <picture class="page-404__image page-404__image-small">
                  <source srcset="images/page-404/img-404-1.avif" type="image/avif" />
                  <source srcset="images/page-404/img-404-1.webp" type="image/webp" />
                  <img
                    src="images/page-404/img-404-1.jpg"
                    alt="Elegant woman in a modern wedding dress with off-the-shoulder design and unusual sleeves"
                    width="200"
                    height="249"
                    loading="lazy"
                  />
                </picture>
                <div class="page-404__content">
                  <h2 class="page-404__title">( 404 )</h2>
                  <a
                    class="page-404__link button button--transparent"
                    href="#"
                    aria-label="Return to homepage"
                  >
                    <span class="icon icon--arrow-in-circle">Return to the main page</span>
                  </a>
                </div>
              </div>
              <picture class="page-404__image page-404__image-big">
                <source srcset="images/page-404/img-404-2.avif" type="image/avif" />
                <source srcset="images/page-404/img-404-2.webp" type="image/webp" />
                <img
                  src="images/page-404/img-404-2.jpg"
                  alt="Elegant woman in a modern wedding dress with a deep cut, embroidered bodice, and voluminous skirt"
                  width="562"
                  height="638"
                  loading="lazy"
                />
              </picture>
            </div>
          </div>
          <div class="moving">
            <span class="moving__content icon icon--moving-decor">page not found </span>
            <span class="moving__content icon icon--moving-decor">page not found</span>
            <span class="moving__content icon icon--moving-decor">page not found</span>
            <span class="moving__content icon icon--moving-decor">page not found</span>
            <span class="moving__content icon icon--moving-decor">page not found</span>
            <span class="moving__content icon icon--moving-decor">page not found</span>
            <span class="moving__content icon icon--moving-decor">page not found</span>
            <span class="moving__content icon icon--moving-decor">page not found</span>
          </div>
        </section>
      </main>
    </div>
    <script src="js/main.min.js"></script>
  </body>
</html>
