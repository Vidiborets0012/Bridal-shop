<header class="header">
  <div class="container">
    <div class="header__inner">
      <div class="header__logo-inner">
        <a class="header__logo logo" href="/" aria-label="Go to home page">
          <img
            class="header__logo-img"
            src="images/logo.svg"
            alt="logo Luxurious Bridal Haven"
            width="245"
            height="26"
          />
        </a>
      </div>
      <div class="header__navigation">
        <nav class="header__lang-menu" aria-label="Switch language">
          <ul class="header__lang-list">
            <li class="header__lang-item header__lang-item--activ" data-text="en">
              <a class="header__lang-link" href="#"><span>en</span></a
              >/
            </li>
            <li class="header__lang-item" data-text="ua">
              <a class="header__lang-link" href="#">ua</a>
            </li>
          </ul>
        </nav>
        <nav class="header__menu" aria-label="Navigate main menu">
          <ul class="header__menu-list">
            <li class="header__menu-item">
              <a class="header__menu-link menu-link" href="#">CATALOG</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link menu-link" href="#">COLLECTIONS</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link menu-link" href="#">ABOUT</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link menu-link" href="#">BOOK AN APPOINTMENT</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link menu-link" href="#">CONTACT</a>
            </li>
          </ul>
        </nav>
        <ul class="header__actions">
          <li class="header__actions-item">
            <a
              class="header__actions-link button button--icon"
              href="#"
              aria-label="Open user profile"
            >
              <span class="header__actions-link-wrapper">
                <svg width="24" height="24">
                  <use xlink:href="images/sprite.svg#user"></use>
                </svg>
              </span>
            </a>
          </li>
          <li class="header__actions-item">
            <a
              class="header__actions-link button button--icon"
              href="#"
              aria-label="View wish list"
            >
              <span class="header__actions-link-wrapper">
                <svg width="24" height="22">
                  <use xlink:href="images/sprite.svg#wish-list"></use>
                </svg>
              </span>
            </a>
          </li>
          <li class="header__actions-item">
            <a
              class="header__actions-link button button--icon"
              href="#"
              aria-label="Open shopping cart"
            >
              <span class="header__actions-link-wrapper">
                <svg width="24" height="24">
                  <use xlink:href="images/sprite.svg#shopping-bag"></use>
                </svg>
              </span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
